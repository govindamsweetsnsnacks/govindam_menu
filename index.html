
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PDF Viewer</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f1f3f5;
    }

    .pdf-container {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .pdf-toolbar {
      min-height: 54px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #202124;
      color: white;
    }

    .pdf-toolbar h1 {
      font-size: 16px;
      font-weight: 500;
    }

    .download-btn {
      display: inline-block;
      padding: 9px 14px;
      border-radius: 5px;
      background: #ffffff;
      color: #202124;
      text-decoration: none;
      font-size: 14px;
      white-space: nowrap;
    }

    .download-btn:hover {
      background: #e5e5e5;
    }

    .pdf-viewer {
      flex: 1;
      min-height: 0;
      width: 100%;
      position: relative;
      background: #e5e7eb;
    }

    .pdf-viewer iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    .fallback {
      padding: 24px;
      text-align: center;
      color: #333;
    }

    .fallback a {
      color: #075fcc;
    }

    @media (max-width: 600px) {
      .pdf-toolbar {
        min-height: 48px;
        padding: 8px 10px;
      }

      .pdf-toolbar h1 {
        font-size: 14px;
      }

      .download-btn {
        padding: 8px 10px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <main class="pdf-container">

    <header class="pdf-toolbar">
      <h1>PDF Viewer</h1>

      <a
        class="download-btn"
        href="./Govindam_menu.pdf"
        download
      >
        Download PDF
      </a>
    </header>

    <section class="pdf-viewer">
      <iframe
        src="./Govindam_menu.pdf#toolbar=1&navpanes=0&view=FitH"
        title="PDF document viewer"
        loading="eager"
      >
        <div class="fallback">
          Your browser cannot display this PDF.
          <a href="./Govindam_menu.pdf">Open or download the PDF</a>.
        </div>
      </iframe>
    </section>

  </main>
</body>
</html>
